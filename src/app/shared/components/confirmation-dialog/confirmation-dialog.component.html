<h2 mat-dialog-title>{{title}}</h2>
<mat-dialog-content class="mat-typography" #scrollMe>
  {{message}}
  <div *ngFor="let section of lists" class="confirmation-dialog-list-section">
    <div class="confirmation-dialog-list-label">{{section.label}}</div>
    <cdk-virtual-scroll-viewport itemSize="18" class="confirmation-dialog-list">
      <div *cdkVirtualFor="let item of section.items" class="confirmation-dialog-list-item">{{ item }}</div>
    </cdk-virtual-scroll-viewport>
  </div>
  <details *ngIf="technicalDetails" class="confirmation-dialog-technical-details">
    <summary>Technical details</summary>
    <pre>{{technicalDetails}}</pre>
  </details>
  <mat-checkbox *ngIf="checkboxLabel" [(ngModel)]="checkboxChecked" class="confirmation-dialog-checkbox">{{checkboxLabel}}</mat-checkbox>
</mat-dialog-content>
<mat-dialog-actions *ngIf="actionsNum == 2" align="end">
  <button mat-button [mat-dialog-close]="action1" (click)="action1Callback()">{{action1Label}}</button>
  <button mat-button [mat-dialog-close]="action2" cdkFocusInitial (click)="action2Callback()">{{action2Label}}</button>
</mat-dialog-actions>
<mat-dialog-actions *ngIf="actionsNum == 1" align="center">
  <button mat-button [mat-dialog-close]="action1" (click)="action1Callback()">{{action1Label}}</button>
</mat-dialog-actions>
